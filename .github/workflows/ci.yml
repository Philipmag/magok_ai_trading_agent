name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint tooling
        run: python -m pip install --upgrade pip flake8

      # Verify every module parses. Full dependency install is intentionally
      # excluded: the ML stack (torch, transformers) is multi-GB and adds no
      # signal to a syntax/lint gate.
      - name: Compile all modules
        run: python -m compileall -q .

      - name: Lint (errors only)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
